<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Toolhouse — Model Uploader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Top bar ─────────────────────────────────── */

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid #1e1e1e;
      -webkit-app-region: drag;
    }

    .topbar button {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    .topbar button:hover { border-color: #555; color: #ddd; }

    .topbar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
    }

    /* ── Content ─────────────────────────────────── */

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-app-region: no-drag;
    }

    /* ── Cards ───────────────────────────────────── */

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid #1e1e1e;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .card-body {
      padding: 20px;
    }

    /* ── Login card ──────────────────────────────── */

    .login-card {
      max-width: 520px;
    }

    .login-desc {
      font-size: 12px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .urls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .url-badge {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 12px;
    }

    .url-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }

    .url-value {
      font-size: 11px;
      color: #888;
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    label.field-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #2e2e2e;
      border-radius: 7px;
      color: #f0f0f0;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    input[type="password"]:focus { border-color: #555; }

    .error {
      font-size: 12px;
      color: #f87171;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* ── Buttons ─────────────────────────────────── */

    button.primary {
      background: #f5f5f5;
      color: #0f0f0f;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover    { background: #e0e0e0; }
    button.primary:active   { background: #ccc; }
    button.primary:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

    button.secondary {
      background: transparent;
      color: #888;
      border: 1px solid #2e2e2e;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    button.secondary:hover    { border-color: #555; color: #ddd; }
    button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }

    button.upload-btn {
      background: #1e3560;
      color: #60a5fa;
      border: 1px solid #2a4a80;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 24px;
      cursor: pointer;
      transition: background 0.12s;
    }

    button.upload-btn:hover    { background: #223f70; }
    button.upload-btn:disabled { background: #1a1a1a; color: #444; border-color: #2a2a2a; cursor: not-allowed; }

    /* ── Spinner ─────────────────────────────────── */

    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #f5f5f5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Target row ──────────────────────────────── */

    .target-row {
      display: flex;
      gap: 12px;
    }

    .target-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color 0.12s;
    }

    .target-item:has(input:checked) { border-color: #2a4a80; }
    .target-item:has(input:disabled) { opacity: 0.4; cursor: not-allowed; }

    .target-item input[type="checkbox"] {
      width: 14px; height: 14px;
      accent-color: #60a5fa;
      cursor: pointer;
      flex-shrink: 0;
    }

    .target-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .badge-nas    { background: #1e2d1e; color: #6fcf6f; }
    .badge-runpod { background: #1e2537; color: #60a5fa; }

    .target-url {
      font-size: 11px;
      color: #555;
      font-family: 'SF Mono', 'Fira Code', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Destination ─────────────────────────────── */

    .dest-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      flex: 1;
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 7px;
      color: #e0e0e0;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    select:focus { border-color: #555; }

    .dest-preview {
      font-size: 11px;
      color: #555;
      font-family: 'SF Mono', 'Fira Code', monospace;
      padding: 6px 0 0;
    }

    /* ── Drop zone ───────────────────────────────── */

    .drop-zone {
      border: 1px dashed #2a2a2a;
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 16px;
    }

    .drop-zone.drag-over {
      border-color: #3a5a90;
      background: #0f1a2a;
    }

    .drop-zone-text {
      font-size: 13px;
      color: #444;
      margin-bottom: 10px;
    }

    /* ── File list ───────────────────────────────── */

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      border: 1px solid #222;
      border-radius: 7px;
      padding: 10px 14px;
    }

    .file-icon { font-size: 16px; flex-shrink: 0; }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-size: 12px;
      color: #ddd;
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size { font-size: 10px; color: #555; margin-top: 2px; }

    .file-remove {
      background: transparent;
      border: none;
      color: #444;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.12s;
      flex-shrink: 0;
    }

    .file-remove:hover { color: #f87171; }

    /* ── Progress ────────────────────────────────── */

    .prog-file-block {
      border-top: 1px solid #1e1e1e;
      padding: 14px 20px;
    }

    .prog-file-block:first-child { border-top: none; }

    .prog-filename {
      font-size: 12px;
      color: #bbb;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prog-target-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .prog-target-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 4px;
      width: 62px;
      text-align: center;
      flex-shrink: 0;
    }

    .prog-track {
      flex: 1;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.15s;
      width: 0%;
    }

    .fill-nas    { background: #6fcf6f; }
    .fill-runpod { background: #60a5fa; }
    .fill-error  { background: #f87171; }
    .fill-done   { background: #4ade80; }

    .prog-pct {
      font-size: 10px;
      color: #555;
      font-family: 'SF Mono', 'Fira Code', monospace;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .prog-status {
      font-size: 10px;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      color: #444;
    }

    .status-ok    { color: #4ade80; }
    .status-err   { color: #f87171; }
    .status-wait  { color: #555; }

    /* ── Action bar ──────────────────────────────── */

    .action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .upload-summary { font-size: 11px; color: #666; margin-left: auto; }

    /* ── Empty state ─────────────────────────────── */

    .empty-hint {
      font-size: 12px;
      color: #3a3a3a;
      font-style: italic;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button onclick="goBack()">← Back</button>
    <span class="topbar-title">Model Uploader</span>
  </div>

  <div class="content">

    <!-- Login card -->
    <div class="card login-card" id="login-card">
      <div class="card-header"><div class="card-title">Connect</div></div>
      <div class="card-body">
        <p class="login-desc">Enter the admin password to connect to your backends and choose where to upload model files.</p>

        <div class="urls-row">
          <div class="url-badge">
            <div class="url-label">Local (NAS)</div>
            <div class="url-value" id="url-local">—</div>
          </div>
          <div class="url-badge">
            <div class="url-label">RunPod</div>
            <div class="url-value" id="url-runpod">—</div>
          </div>
        </div>

        <label class="field-label" for="password">Admin Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

        <div class="error" id="error"></div>

        <button class="primary" id="connect-btn" onclick="doConnect()">
          Connect
          <span class="spinner" id="spinner"></span>
        </button>
      </div>
    </div>

    <!-- Upload UI — shown after connect -->
    <div id="upload-ui" style="display:none; flex-direction:column; gap:20px;">

      <!-- Targets -->
      <div class="card">
        <div class="card-header"><div class="card-title">Upload Targets</div></div>
        <div class="card-body">
          <div class="target-row">
            <label class="target-item" id="target-item-local">
              <input type="checkbox" id="chk-local" checked onchange="refreshUploadBtn()">
              <span class="target-badge badge-nas">NAS</span>
              <span class="target-url" id="turl-local">—</span>
            </label>
            <label class="target-item" id="target-item-runpod">
              <input type="checkbox" id="chk-runpod" checked onchange="refreshUploadBtn()">
              <span class="target-badge badge-runpod">RunPod</span>
              <span class="target-url" id="turl-runpod">—</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Destination -->
      <div class="card">
        <div class="card-header"><div class="card-title">Destination Folder</div></div>
        <div class="card-body">
          <div class="dest-row">
            <select id="dest-select" onchange="updateDestPreview()">
              <option value="">(root — models/)</option>
            </select>
          </div>
          <div class="dest-preview" id="dest-preview">models/</div>
        </div>
      </div>

      <!-- Files -->
      <div class="card">
        <div class="card-header"><div class="card-title">Files</div></div>
        <div class="card-body">
          <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-text">Drop model files here</div>
            <button class="secondary" onclick="browseFiles()">Browse files…</button>
          </div>
          <div class="file-list" id="file-list"></div>
          <div class="action-bar">
            <button class="upload-btn" id="upload-btn" onclick="startUpload()" disabled>↑ Upload</button>
            <span class="upload-summary" id="upload-summary"></span>
          </div>
        </div>
      </div>

      <!-- Progress (appears once upload starts) -->
      <div class="card" id="prog-card" style="display:none;">
        <div class="card-header"><div class="card-title">Progress</div></div>
        <div id="prog-body"></div>
      </div>

    </div>
  </div>

  <script>
    // ── State ─────────────────────────────────────────────────────────────────

    let sessionPassword = ''
    let sessionConfig   = null
    let fileQueue       = []   // [{ name, localPath, size }]

    // ── Navigation ────────────────────────────────────────────────────────────

    function goBack() { window.location.reload() }

    // ── Init ──────────────────────────────────────────────────────────────────

    window.electronAPI.getBackendConfig().then(cfg => {
      sessionConfig = cfg
      document.getElementById('url-local').textContent  = cfg.localUrl  || '(not set)'
      document.getElementById('url-runpod').textContent = cfg.runpodUrl || '(not set)'
    })

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doConnect()
    })

    // ── Connect ───────────────────────────────────────────────────────────────

    async function doConnect() {
      const pw     = document.getElementById('password').value
      const errEl  = document.getElementById('error')
      const btn    = document.getElementById('connect-btn')
      const spin   = document.getElementById('spinner')

      errEl.textContent = ''
      if (!pw) { errEl.textContent = 'Enter the admin password.'; return }

      btn.disabled      = true
      spin.style.display = 'inline-block'

      const result = await window.electronAPI.getModelDirs({ password: pw })

      btn.disabled       = false
      spin.style.display = 'none'

      if (!result || (result.local?.error && result.runpod?.error)) {
        errEl.textContent = result?.local?.error || result?.runpod?.error || 'Could not connect to any backend.'
        return
      }

      sessionPassword = pw

      // Populate targets
      const hasLocal  = sessionConfig?.localUrl  && !result.local?.error
      const hasRunpod = sessionConfig?.runpodUrl && !result.runpod?.error

      document.getElementById('turl-local').textContent  = sessionConfig?.localUrl  || '—'
      document.getElementById('turl-runpod').textContent = sessionConfig?.runpodUrl || '—'

      const chkLocal  = document.getElementById('chk-local')
      const chkRunpod = document.getElementById('chk-runpod')
      const itemLocal  = document.getElementById('target-item-local')
      const itemRunpod = document.getElementById('target-item-runpod')

      if (!hasLocal)  { chkLocal.checked  = false; chkLocal.disabled  = true; itemLocal.style.opacity  = '0.4' }
      if (!hasRunpod) { chkRunpod.checked = false; chkRunpod.disabled = true; itemRunpod.style.opacity = '0.4' }

      // Populate destination dropdown
      const sel = document.getElementById('dest-select')
      sel.innerHTML = '<option value="">(root — models/)</option>'
      for (const d of (result.allDirs || [])) {
        const opt = document.createElement('option')
        opt.value       = d
        opt.textContent = d + '/'
        sel.appendChild(opt)
      }
      updateDestPreview()

      // Show upload UI
      document.getElementById('login-card').style.display  = 'none'
      document.getElementById('upload-ui').style.display   = 'flex'
    }

    // ── Destination ───────────────────────────────────────────────────────────

    function updateDestPreview() {
      const val = document.getElementById('dest-select').value
      document.getElementById('dest-preview').textContent = val ? `models/${val}/` : 'models/'
    }

    function getDestDir() {
      return document.getElementById('dest-select').value
    }

    // ── File handling ─────────────────────────────────────────────────────────

    async function browseFiles() {
      const files = await window.electronAPI.openFileDialog()
      for (const f of files) addFile(f)
    }

    function addFile(f) {
      if (fileQueue.find(x => x.localPath === f.localPath)) return  // no dupes
      fileQueue.push(f)
      renderFileList()
    }

    function removeFile(localPath) {
      fileQueue = fileQueue.filter(f => f.localPath !== localPath)
      renderFileList()
    }

    function renderFileList() {
      const list = document.getElementById('file-list')
      if (fileQueue.length === 0) {
        list.innerHTML = ''
        refreshUploadBtn()
        return
      }

      list.innerHTML = fileQueue.map(f => `
        <div class="file-row">
          <span class="file-icon">📦</span>
          <div class="file-info">
            <div class="file-name" title="${esc(f.localPath)}">${esc(f.name)}</div>
            <div class="file-size">${fmtSize(f.size)}</div>
          </div>
          <button class="file-remove" onclick="removeFile('${esc(f.localPath)}')" title="Remove">×</button>
        </div>`).join('')

      refreshUploadBtn()
    }

    // ── Drop zone ─────────────────────────────────────────────────────────────

    const dropZone = document.getElementById('drop-zone')

    dropZone.addEventListener('dragover', e => {
      e.preventDefault()
      dropZone.classList.add('drag-over')
    })

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over')
    })

    dropZone.addEventListener('drop', e => {
      e.preventDefault()
      dropZone.classList.remove('drag-over')
      // In Electron the File object has a .path property even with contextIsolation
      for (const file of e.dataTransfer.files) {
        if (file.path) {
          addFile({ name: file.name, localPath: file.path, size: file.size })
        }
      }
    })

    // ── Upload UI state ───────────────────────────────────────────────────────

    function getTargets() {
      const t = []
      if (document.getElementById('chk-local')?.checked)  t.push('local')
      if (document.getElementById('chk-runpod')?.checked) t.push('runpod')
      return t
    }

    function refreshUploadBtn() {
      const btn = document.getElementById('upload-btn')
      const sum = document.getElementById('upload-summary')
      const targets = getTargets()
      const ok = fileQueue.length > 0 && targets.length > 0
      btn.disabled = !ok

      if (ok) {
        const totalBytes = fileQueue.reduce((a, f) => a + f.size, 0)
        sum.textContent = `${fileQueue.length} file${fileQueue.length !== 1 ? 's' : ''}  ·  ${fmtSize(totalBytes)}  →  ${targets.join(' + ').replace('local','NAS').replace('runpod','RunPod')}`
      } else {
        sum.textContent = ''
      }
    }

    // ── Upload ────────────────────────────────────────────────────────────────

    async function startUpload() {
      const targets = getTargets()
      if (fileQueue.length === 0 || targets.length === 0) return

      const destDir = getDestDir()
      const btn     = document.getElementById('upload-btn')
      btn.disabled  = true

      // Build progress UI
      buildProgressUI(fileQueue, targets)
      document.getElementById('prog-card').style.display = ''

      window.electronAPI.offUploadProgress()
      window.electronAPI.onUploadProgress(({ fi, name, target, loaded, total, done, error }) => {
        updateProgress(fi, target, loaded, total, done, error)
      })

      const result = await window.electronAPI.uploadModels({
        files:    fileQueue.map(f => ({ name: f.name, localPath: f.localPath, size: f.size })),
        destDir,
        targets,
        password: sessionPassword,
      })

      btn.disabled = false

      if (result.error) {
        // top-level auth error
        document.getElementById('prog-body').innerHTML +=
          `<div style="padding:14px 20px;color:#f87171;font-size:12px;">✗ ${esc(result.error)}</div>`
      }
    }

    // ── Progress rendering ────────────────────────────────────────────────────

    function buildProgressUI(files, targets) {
      const body = document.getElementById('prog-body')
      body.innerHTML = files.map((f, fi) => {
        const bars = targets.map(t => `
          <div class="prog-target-row" id="ptr-${fi}-${t}">
            <span class="prog-target-badge ${t === 'local' ? 'badge-nas' : 'badge-runpod'}">${t === 'local' ? 'NAS' : 'RunPod'}</span>
            <div class="prog-track"><div class="prog-fill ${t === 'local' ? 'fill-nas' : 'fill-runpod'}" id="pf-${fi}-${t}" style="width:0%"></div></div>
            <span class="prog-pct" id="pp-${fi}-${t}">—</span>
            <span class="prog-status status-wait" id="ps-${fi}-${t}">waiting</span>
          </div>`).join('')
        return `
          <div class="prog-file-block">
            <div class="prog-filename" title="${esc(f.localPath)}">${esc(f.name)}</div>
            ${bars}
          </div>`
      }).join('')
    }

    function updateProgress(fi, target, loaded, total, done, error) {
      const fillEl   = document.getElementById(`pf-${fi}-${target}`)
      const pctEl    = document.getElementById(`pp-${fi}-${target}`)
      const statusEl = document.getElementById(`ps-${fi}-${target}`)
      if (!fillEl) return

      if (error) {
        fillEl.className = 'prog-fill fill-error'
        fillEl.style.width = '100%'
        pctEl.textContent = '✗'
        statusEl.textContent = 'error'
        statusEl.className   = 'prog-status status-err'
        fillEl.parentElement.parentElement.title = error
        return
      }

      const pct = total > 0 ? Math.round((loaded / total) * 100) : 0
      fillEl.style.width = pct + '%'
      pctEl.textContent  = pct + '%'

      if (done) {
        fillEl.className   = 'prog-fill fill-done'
        fillEl.style.width = '100%'
        pctEl.textContent  = '100%'
        statusEl.textContent = '✓ done'
        statusEl.className   = 'prog-status status-ok'
      } else {
        statusEl.textContent = fmtSize(loaded)
        statusEl.className   = 'prog-status status-wait'
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function fmtSize(bytes) {
      if (bytes < 1024)       return bytes + ' B'
      if (bytes < 1048576)    return (bytes / 1024).toFixed(1) + ' KB'
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB'
      return (bytes / 1073741824).toFixed(2) + ' GB'
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    }
  </script>
</body>
</html>
