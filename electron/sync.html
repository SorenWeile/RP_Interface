<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Toolhouse — Sync Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Top bar ─────────────────────────────────── */

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid #1e1e1e;
      -webkit-app-region: drag;
    }

    .topbar button {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    .topbar button:hover { border-color: #555; color: #ddd; }

    .topbar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
    }

    /* ── Scrollable content ──────────────────────── */

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      -webkit-app-region: no-drag;
    }

    /* ── Login card ──────────────────────────────── */

    .login-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 28px 32px;
      max-width: 520px;
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 12px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .urls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .url-badge {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 12px;
    }

    .url-badge .url-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }

    .url-badge .url-value {
      font-size: 11px;
      color: #888;
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #2e2e2e;
      border-radius: 7px;
      color: #f0f0f0;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    input[type="password"]:focus { border-color: #555; }

    .error {
      font-size: 12px;
      color: #f87171;
      margin-bottom: 12px;
      min-height: 18px;
    }

    button.primary {
      background: #f5f5f5;
      color: #0f0f0f;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover    { background: #e0e0e0; }
    button.primary:active   { background: #ccc; }
    button.primary:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

    /* ── Spinner ─────────────────────────────────── */

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid #333;
      border-top-color: #f5f5f5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ─────────────────────────────────── */

    .results { display: none; flex-direction: column; gap: 20px; }

    .section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid #1e1e1e;
      user-select: none;
    }

    .section-header:hover { background: #1f1f1f; }

    .section-title   { font-size: 13px; font-weight: 600; color: #e0e0e0; flex: 1; }
    .section-summary { font-size: 11px; color: #666; }
    .section-chevron { font-size: 11px; color: #555; transition: transform 0.15s; }

    .section.collapsed .section-chevron { transform: rotate(-90deg); }
    .section.collapsed .section-body    { display: none; }

    .section-body { padding: 0; }

    /* ── Summary pills ───────────────────────────── */

    .pill-row {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid #1e1e1e;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }

    .pill-count  { font-weight: 700; }
    .pill-nas    { background: #1e2d1e; color: #6fcf6f; border: 1px solid #2a4a2a; }
    .pill-runpod { background: #1e2537; color: #60a5fa; border: 1px solid #1e3560; }
    .pill-diff   { background: #2d2010; color: #fb923c; border: 1px solid #4a3010; }

    /* ── Transfer / merge bar ────────────────────── */

    .transfer-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .transfer-count { font-size: 11px; color: #888; }

    .sel-all-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    button.transfer-btn {
      background: #1e3560;
      color: #60a5fa;
      border: 1px solid #2a4a80;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    button.transfer-btn:hover    { background: #223f70; border-color: #3a5a90; }
    button.transfer-btn:disabled { background: #1a1a1a; color: #444; border-color: #2a2a2a; cursor: not-allowed; }

    button.merge-btn {
      background: #2d1e37;
      color: #c084fc;
      border: 1px solid #4a2a80;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.12s;
    }

    button.merge-btn:hover    { background: #3a2a4a; }
    button.merge-btn:disabled { background: #1a1a1a; color: #444; border-color: #2a2a2a; cursor: not-allowed; }

    /* ── Progress bar ────────────────────────────── */

    .progress-wrap {
      display: none;
      padding: 12px 20px;
      border-bottom: 1px solid #1e1e1e;
      flex-direction: column;
      gap: 6px;
    }

    .progress-wrap.visible { display: flex; }

    .progress-track { height: 4px; background: #222; border-radius: 2px; overflow: hidden; }

    .progress-fill {
      height: 100%;
      background: #60a5fa;
      border-radius: 2px;
      transition: width 0.2s;
      width: 0%;
    }

    .progress-label  { font-size: 11px; color: #666; font-family: 'SF Mono', 'Fira Code', monospace; }
    .progress-errors { font-size: 11px; color: #f87171; margin-top: 2px; }

    /* ── Explorer tree ───────────────────────────── */

    .explorer-col-header {
      display: flex;
      align-items: center;
      padding: 6px 20px;
      background: #151515;
      font-size: 10px;
      font-weight: 500;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #1a1a1a;
    }

    .exp-col-path   { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .exp-col-nas    { width: 90px; text-align: right; flex-shrink: 0; }
    .exp-col-rp     { width: 90px; text-align: right; flex-shrink: 0; margin-right: 8px; }
    .exp-col-action { width: 20px; flex-shrink: 0; }

    .exp-row {
      display: flex;
      align-items: center;
      padding: 4px 20px;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #777;
      border-bottom: 1px solid #181818;
    }

    .exp-row:hover { background: #1d1d1d; }
    .exp-row .exp-col-path { color: #999; padding-left: 16px; }

    .row-synced    .exp-col-path { color: #666; }
    .row-only-nas  .exp-col-path { color: #6fcf6f; }
    .row-only-rp   .exp-col-path { color: #60a5fa; }
    .row-diff      .exp-col-path { color: #fb923c; }

    .exp-absent { color: #2a2a2a; }

    .row-transferred        { opacity: 0.35; }
    .row-transfer-error .exp-col-path { color: #f87171; }

    /* Hide-synced mode */
    .show-diff-only .row-synced { display: none; }
    .show-diff-only .folder-row:not([data-has-diff="true"]) { display: none; }
    .show-diff-only .folder-row:not([data-has-diff="true"]) + div { display: none; }

    .folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: #161616;
      border-bottom: 1px solid #1e1e1e;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .folder-row:hover { background: #1d1d1d; }
    .folder-icon  { color: #555; font-size: 11px; width: 10px; text-align: center; flex-shrink: 0; }
    .folder-name  { color: #aaa; font-family: 'SF Mono', 'Fira Code', monospace; }
    .folder-stats { color: #444; font-size: 10px; margin-left: auto; }

    /* ── Checkboxes ──────────────────────────────── */

    input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: #60a5fa;
      cursor: pointer;
    }

    /* ── DB section ──────────────────────────────── */

    .db-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .db-table-wrap {
      border-right: 1px solid #1e1e1e;
      padding: 14px 20px;
    }

    .db-table-wrap:nth-child(even) { border-right: none; }
    .db-table-wrap:nth-child(n+3)  { border-top: 1px solid #1e1e1e; }

    .db-table-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 10px;
    }

    .db-diff-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 3px 0;
    }

    .db-diff-row .db-name { color: #bbb; font-family: 'SF Mono', 'Fira Code', monospace; }
    .db-diff-row .db-side { font-size: 10px; padding: 1px 6px; border-radius: 4px; }
    .db-diff-row .on-nas    { background: #1e2d1e; color: #6fcf6f; }
    .db-diff-row .on-runpod { background: #1e2537; color: #60a5fa; }

    .db-synced { font-size: 11px; color: #3a3a3a; font-style: italic; }

    .empty { padding: 16px 20px; font-size: 12px; color: #3a3a3a; font-style: italic; }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="topbar">
    <button onclick="goBack()">← Back</button>
    <span class="topbar-title">Sync Tool</span>
  </div>

  <!-- Scrollable content -->
  <div class="content">

    <!-- Login card -->
    <div class="login-card" id="login-card">
      <h2>Compare Backends</h2>
      <p>Scans both your Local and RunPod backends and shows what's different — output files, models, and database records.</p>

      <div class="urls-row">
        <div class="url-badge">
          <div class="url-label">Local (NAS)</div>
          <div class="url-value" id="url-local-display">—</div>
        </div>
        <div class="url-badge">
          <div class="url-label">RunPod</div>
          <div class="url-value" id="url-runpod-display">—</div>
        </div>
      </div>

      <label for="password">Admin Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

      <div class="error" id="error"></div>

      <button class="primary" id="compare-btn" onclick="runCompare()">
        Compare
        <span class="spinner" id="spinner"></span>
      </button>
    </div>

    <!-- Results (hidden until compare runs) -->
    <div class="results" id="results">

      <!-- Output Files -->
      <div class="section" id="sec-files">
        <div class="section-header" onclick="toggleSection('sec-files')">
          <span class="section-title">Output Files</span>
          <span class="section-summary" id="sum-files"></span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body" id="body-files"></div>
      </div>

      <!-- Models -->
      <div class="section" id="sec-models">
        <div class="section-header" onclick="toggleSection('sec-models')">
          <span class="section-title">Models</span>
          <span class="section-summary" id="sum-models"></span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body" id="body-models"></div>
      </div>

      <!-- Databases -->
      <div class="section" id="sec-db">
        <div class="section-header" onclick="toggleSection('sec-db')">
          <span class="section-title">Databases</span>
          <span class="section-summary" id="sum-db"></span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body" id="body-db"></div>
      </div>

    </div>
  </div>

  <script>
    // password kept in memory so Transfer/Merge can reuse it without re-prompting
    let sessionPassword = ''

    // ── Navigation ────────────────────────────────────────────────────────────

    function goBack() {
      window.electronAPI.getBackendUrl().then(url => {
        if (url) window.location.reload()
      })
    }

    // ── Pre-fill stored URLs ──────────────────────────────────────────────────

    window.electronAPI.getBackendConfig().then(cfg => {
      document.getElementById('url-local-display').textContent  = cfg.localUrl  || '(not set)'
      document.getElementById('url-runpod-display').textContent = cfg.runpodUrl || '(not set)'
    })

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') runCompare()
    })

    // ── Compare ───────────────────────────────────────────────────────────────

    async function runCompare() {
      const password = document.getElementById('password').value
      const errEl    = document.getElementById('error')
      const btn      = document.getElementById('compare-btn')
      const spinner  = document.getElementById('spinner')

      errEl.textContent = ''
      if (!password) { errEl.textContent = 'Enter the admin password.'; return }

      btn.disabled          = true
      spinner.style.display = 'inline-block'
      document.getElementById('results').style.display = 'none'

      const result = await window.electronAPI.compareBackends({ password })

      btn.disabled          = false
      spinner.style.display = 'none'

      if (result.error) { errEl.textContent = result.error; return }

      sessionPassword = password

      renderFiles(result.files,  'body-files',  'sum-files',  'files')
      renderFiles(result.models, 'body-models', 'sum-models', 'models')
      renderDb(result.db)

      document.getElementById('results').style.display = 'flex'
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function fmtSize(bytes) {
      if (bytes < 1024)       return bytes + ' B'
      if (bytes < 1048576)    return (bytes / 1024).toFixed(1) + ' KB'
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB'
      return (bytes / 1073741824).toFixed(2) + ' GB'
    }

    function toggleSection(id) {
      document.getElementById(id).classList.toggle('collapsed')
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    // ── Explorer tree ─────────────────────────────────────────────────────────

    function buildFileMap(diff) {
      const map = new Map()
      for (const f of (diff.synced    || [])) map.set(f.path, { nasSize: f.size,   rpSize: f.size,          status: 'synced'      })
      for (const f of diff.onlyLocal)          map.set(f.path, { nasSize: f.size,   rpSize: null,            status: 'only-nas'    })
      for (const f of diff.different)          map.set(f.path, { nasSize: f.size,   rpSize: f.runpodSize,    status: 'different'   })
      for (const f of diff.onlyRunpod)         map.set(f.path, { nasSize: null,     rpSize: f.size,          status: 'only-runpod' })
      return map
    }

    function renderFiles(diff, bodyId, sumId, key) {
      const body  = document.getElementById(bodyId)
      const sum   = document.getElementById(sumId)
      const nDiff = diff.onlyLocal.length + diff.onlyRunpod.length + diff.different.length

      if (diff.totalLocal === 0 && diff.totalRunpod === 0) {
        sum.textContent = '0 files'
        body.innerHTML  = '<div class="empty">No files found on either backend.</div>'
        return
      }

      if (nDiff === 0) {
        sum.textContent = `${diff.totalLocal} files — in sync`
        body.innerHTML  = '<div class="empty">Everything is in sync.</div>'
        return
      }

      sum.textContent = `${diff.onlyLocal.length} only NAS · ${diff.onlyRunpod.length} only RunPod · ${diff.different.length} mismatch`

      const fileMap = buildFileMap(diff)

      // Group by first path segment
      const folders   = new Map()
      const rootFiles = []

      for (const [filePath, info] of fileMap) {
        const idx = filePath.indexOf('/')
        if (idx === -1) {
          rootFiles.push({ name: filePath, path: filePath, ...info })
        } else {
          const folder = filePath.slice(0, idx)
          if (!folders.has(folder)) folders.set(folder, [])
          folders.get(folder).push({ name: filePath.slice(idx + 1), path: filePath, ...info })
        }
      }

      // Models: alpha order; output files: reverse-alpha (newest date folders first)
      const sortedFolders = [...folders.entries()].sort(([a], [b]) =>
        key === 'models' ? a.localeCompare(b) : b.localeCompare(a)
      )

      const hasTransfer = diff.onlyRunpod.length > 0

      const pills = `
        <div class="pill-row">
          <span class="pill pill-nas">   <span class="pill-count">${diff.totalLocal}</span>  on NAS</span>
          <span class="pill pill-runpod"><span class="pill-count">${diff.totalRunpod}</span> on RunPod</span>
          ${diff.onlyLocal.length  ? `<span class="pill pill-nas">   <span class="pill-count">${diff.onlyLocal.length}</span>  only NAS</span>`    : ''}
          ${diff.onlyRunpod.length ? `<span class="pill pill-runpod"><span class="pill-count">${diff.onlyRunpod.length}</span> only RunPod</span>` : ''}
          ${diff.different.length  ? `<span class="pill pill-diff">  <span class="pill-count">${diff.different.length}</span>  mismatch</span>`    : ''}
          <label class="sel-all-label" style="margin-left:auto">
            <input type="checkbox" id="hide-synced-${key}" onchange="toggleHideSynced('${key}', this.checked)"> Hide synced
          </label>
          ${hasTransfer ? `
          <div class="transfer-bar">
            <label class="sel-all-label">
              <input type="checkbox" id="sel-all-${key}" onchange="selectAll('${key}', this.checked)"> Select all
            </label>
            <span class="transfer-count" id="tc-${key}">0 selected</span>
            <button class="transfer-btn" id="tbtn-${key}" onclick="startTransfer('${key}')" disabled>↓ Transfer to NAS</button>
          </div>` : ''}
        </div>`

      const progressHtml = `
        <div class="progress-wrap" id="prog-${key}">
          <div class="progress-track"><div class="progress-fill" id="prog-fill-${key}"></div></div>
          <div class="progress-label"  id="prog-label-${key}"></div>
          <div class="progress-errors" id="prog-errors-${key}"></div>
        </div>`

      const colHeader = `
        <div class="explorer-col-header">
          <span class="exp-col-path">Name</span>
          <span class="exp-col-nas">NAS</span>
          <span class="exp-col-rp">RunPod</span>
          <span class="exp-col-action"></span>
        </div>`

      let rows = ''
      let folderIdx = 0

      // Root-level files (no parent folder)
      for (const f of rootFiles.sort((a, b) => a.name.localeCompare(b.name))) {
        rows += expFileRow(f, key)
      }

      // Folder groups
      for (const [folder, files] of sortedFolders) {
        const fkey    = `${key}_${folderIdx++}`
        const nasCnt  = files.filter(f => f.nasSize !== null).length
        const rpCnt   = files.filter(f => f.rpSize  !== null).length
        const diffCnt = files.filter(f => f.status !== 'synced').length
        const diffBadge = diffCnt ? ` · <span style="color:#fb923c">${diffCnt} diff</span>` : ''
        rows += `
          <div class="folder-row" data-has-diff="${diffCnt > 0}" onclick="toggleFolder('${fkey}')">
            <span class="folder-icon" id="ficon-${fkey}">▾</span>
            <span class="folder-name">${esc(folder)}/</span>
            <span class="folder-stats">${nasCnt} NAS · ${rpCnt} RunPod${diffBadge}</span>
          </div>
          <div id="fc-${fkey}">`
        for (const f of [...files].sort((a, b) => a.name.localeCompare(b.name))) {
          rows += expFileRow(f, key)
        }
        rows += '</div>'
      }

      body.innerHTML = pills + progressHtml + colHeader + `<div id="explorer-${key}">${rows}</div>`

      if (hasTransfer) updateTransferCount(key)
    }

    function expFileRow(f, key) {
      const cls = {
        'synced':      'row-synced',
        'only-nas':    'row-only-nas',
        'only-runpod': 'row-only-rp',
        'different':   'row-diff',
      }[f.status] || ''

      const nasCell = f.nasSize !== null
        ? `<span>${fmtSize(f.nasSize)}</span>`
        : `<span class="exp-absent">—</span>`
      const rpCell = f.rpSize !== null
        ? `<span>${fmtSize(f.rpSize)}</span>`
        : `<span class="exp-absent">—</span>`
      const action = f.status === 'only-runpod'
        ? `<input type="checkbox" class="file-checkbox" data-path="${esc(f.path)}" onchange="updateTransferCount('${key}')">`
        : ''

      return `
        <div class="exp-row ${cls}" data-path="${esc(f.path)}">
          <span class="exp-col-path" title="${esc(f.path)}">${esc(f.name)}</span>
          <span class="exp-col-nas">${nasCell}</span>
          <span class="exp-col-rp">${rpCell}</span>
          <span class="exp-col-action">${action}</span>
        </div>`
    }

    function toggleFolder(fkey) {
      const content = document.getElementById(`fc-${fkey}`)
      const icon    = document.getElementById(`ficon-${fkey}`)
      if (!content) return
      const hidden = content.style.display === 'none'
      content.style.display = hidden ? '' : 'none'
      if (icon) icon.textContent = hidden ? '▾' : '▸'
    }

    function toggleHideSynced(key, hide) {
      document.getElementById(`explorer-${key}`)?.classList.toggle('show-diff-only', hide)
    }

    // ── Checkbox helpers ──────────────────────────────────────────────────────

    function selectAll(key, checked) {
      document.getElementById(`explorer-${key}`)
        ?.querySelectorAll('.file-checkbox:not(:disabled)')
        .forEach(cb => { cb.checked = checked })
      updateTransferCount(key)
    }

    function updateTransferCount(key) {
      const explorer = document.getElementById(`explorer-${key}`)
      if (!explorer) return
      const count   = explorer.querySelectorAll('.file-checkbox:checked').length
      const countEl = document.getElementById(`tc-${key}`)
      const btn     = document.getElementById(`tbtn-${key}`)
      if (countEl) countEl.textContent = count === 0 ? '0 selected' : `${count} selected`
      if (btn)     btn.disabled = count === 0
    }

    // ── Transfer ──────────────────────────────────────────────────────────────

    async function startTransfer(key) {
      const explorer = document.getElementById(`explorer-${key}`)
      const selected = [...explorer.querySelectorAll('.file-checkbox:checked')]
        .map(cb => cb.getAttribute('data-path'))

      if (selected.length === 0) return

      const btn        = document.getElementById(`tbtn-${key}`)
      const selAll     = document.getElementById(`sel-all-${key}`)
      const progWrap   = document.getElementById(`prog-${key}`)
      const progFill   = document.getElementById(`prog-fill-${key}`)
      const progLabel  = document.getElementById(`prog-label-${key}`)
      const progErrors = document.getElementById(`prog-errors-${key}`)

      btn.disabled = true
      if (selAll) selAll.disabled = true
      explorer.querySelectorAll('.file-checkbox').forEach(cb => { cb.disabled = true })
      progWrap.classList.add('visible')
      progErrors.textContent = ''
      progLabel.textContent  = `0 / ${selected.length}`
      progFill.style.width   = '0%'

      const errorList = []

      window.electronAPI.offTransferProgress()
      window.electronAPI.onTransferProgress(({ done, total, path, error }) => {
        progFill.style.width  = Math.round((done / total) * 100) + '%'
        progLabel.textContent = `${done} / ${total}  —  ${path.split('/').pop()}`

        const matchRow = [...explorer.querySelectorAll('.exp-row[data-path]')]
          .find(el => el.getAttribute('data-path') === path)
        if (matchRow) {
          if (error) {
            matchRow.classList.add('row-transfer-error')
            errorList.push(`${path}: ${error}`)
          } else {
            matchRow.classList.add('row-transferred')
          }
        }

        if (done === total) {
          progLabel.textContent = `Done — ${done - errorList.length} transferred, ${errorList.length} failed`
          if (errorList.length) progErrors.innerHTML = errorList.map(e => esc(e)).join('<br>')
        }
      })

      await window.electronAPI.transferFiles({ paths: selected, password: sessionPassword })

      explorer.querySelectorAll('.file-checkbox').forEach(cb => {
        const row = cb.closest('.exp-row')
        if (row && !row.classList.contains('row-transferred')) cb.disabled = false
      })
      if (selAll) selAll.disabled = false
      updateTransferCount(key)
    }

    // ── DB diff rendering ─────────────────────────────────────────────────────

    function renderDb(db) {
      const body = document.getElementById('body-db')
      const sum  = document.getElementById('sum-db')

      const tables = [
        { key: 'users',    label: 'Users',    nameKey: 'username' },
        { key: 'groups',   label: 'Groups',   nameKey: 'name'     },
        { key: 'clients',  label: 'Clients',  nameKey: 'name'     },
        { key: 'projects', label: 'Projects', nameKey: 'name'     },
        { key: 'tools',    label: 'Tools',    nameKey: 'name'     },
      ]

      let totalDiffs = 0
      let gridHtml   = '<div class="db-grid">'

      for (const t of tables) {
        const diff = db[t.key]
        if (!diff) continue

        totalDiffs += diff.onlyLocal.length + diff.onlyRunpod.length

        let rowsHtml = ''
        for (const r of diff.onlyLocal) {
          rowsHtml += `<div class="db-diff-row">
            <span class="db-name">${esc(String(r[t.nameKey] ?? r.id ?? '?'))}</span>
            <span class="db-side on-nas">NAS only</span>
          </div>`
        }
        for (const r of diff.onlyRunpod) {
          rowsHtml += `<div class="db-diff-row">
            <span class="db-name">${esc(String(r[t.nameKey] ?? r.id ?? '?'))}</span>
            <span class="db-side on-runpod">RunPod only</span>
          </div>`
        }
        if (!rowsHtml) rowsHtml = `<div class="db-synced">In sync (${diff.totalLocal})</div>`

        gridHtml += `<div class="db-table-wrap">
          <div class="db-table-title">${t.label}</div>
          ${rowsHtml}
        </div>`
      }

      gridHtml += '</div>'

      body.innerHTML = `
        <div class="pill-row">
          <span style="font-size:12px;color:#555;">Copies NAS-only records into RunPod. Existing records are kept untouched.</span>
          <div class="transfer-bar">
            <span id="merge-status" style="font-size:11px;color:#888;"></span>
            <button class="merge-btn" id="merge-btn" onclick="handleMerge()">↑ Merge NAS → RunPod</button>
          </div>
        </div>
        ${gridHtml}`

      sum.textContent = totalDiffs === 0
        ? 'In sync'
        : `${totalDiffs} difference${totalDiffs !== 1 ? 's' : ''}`
    }

    async function handleMerge() {
      const btn      = document.getElementById('merge-btn')
      const statusEl = document.getElementById('merge-status')

      btn.disabled         = true
      statusEl.textContent = 'Merging…'
      statusEl.style.color = '#888'

      const result = await window.electronAPI.mergeDb({ password: sessionPassword })

      btn.disabled = false

      if (result.error) {
        statusEl.textContent = '✗ ' + result.error
        statusEl.style.color = '#f87171'
        return
      }

      const ins     = result.inserted
      const summary = Object.entries(ins)
        .filter(([, v]) => v > 0)
        .map(([k, v]) => `${v} ${k}`)
        .join(', ')
      statusEl.textContent = summary ? `✓ Inserted: ${summary}` : '✓ Nothing new to merge'
      statusEl.style.color = '#6fcf6f'
    }
  </script>
</body>
</html>
