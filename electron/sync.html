<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Toolhouse — Sync Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Top bar ─────────────────────────────────── */

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid #1e1e1e;
      -webkit-app-region: drag;
    }

    .topbar button {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    .topbar button:hover { border-color: #555; color: #ddd; }

    .topbar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
    }

    /* ── Scrollable content ──────────────────────── */

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      -webkit-app-region: no-drag;
    }

    /* ── Login card ──────────────────────────────── */

    .login-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 28px 32px;
      max-width: 520px;
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 12px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .urls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .url-badge {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 12px;
    }

    .url-badge .url-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }

    .url-badge .url-value {
      font-size: 11px;
      color: #888;
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #2e2e2e;
      border-radius: 7px;
      color: #f0f0f0;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    input[type="password"]:focus { border-color: #555; }

    .error {
      font-size: 12px;
      color: #f87171;
      margin-bottom: 12px;
      min-height: 18px;
    }

    button.primary {
      background: #f5f5f5;
      color: #0f0f0f;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover    { background: #e0e0e0; }
    button.primary:active   { background: #ccc; }
    button.primary:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

    /* ── Spinner ─────────────────────────────────── */

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid #333;
      border-top-color: #f5f5f5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ─────────────────────────────────── */

    .results { display: none; flex-direction: column; gap: 20px; }

    .section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid #1e1e1e;
      user-select: none;
    }

    .section-header:hover { background: #1f1f1f; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
      flex: 1;
    }

    .section-summary { font-size: 11px; color: #666; }

    .section-chevron {
      font-size: 11px;
      color: #555;
      transition: transform 0.15s;
    }

    .section.collapsed .section-chevron { transform: rotate(-90deg); }
    .section.collapsed .section-body    { display: none; }

    .section-body { padding: 0; }

    /* ── Summary pills ───────────────────────────── */

    .pill-row {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid #1e1e1e;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }

    .pill-count { font-weight: 700; }

    .pill-nas    { background: #1e2d1e; color: #6fcf6f; border: 1px solid #2a4a2a; }
    .pill-runpod { background: #1e2537; color: #60a5fa; border: 1px solid #1e3560; }
    .pill-diff   { background: #2d2010; color: #fb923c; border: 1px solid #4a3010; }

    /* ── Transfer bar (inside pill-row) ─────────── */

    .transfer-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .transfer-count {
      font-size: 11px;
      color: #888;
    }

    button.transfer-btn {
      background: #1e3560;
      color: #60a5fa;
      border: 1px solid #2a4a80;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    button.transfer-btn:hover    { background: #223f70; border-color: #3a5a90; }
    button.transfer-btn:disabled { background: #1a1a1a; color: #444; border-color: #2a2a2a; cursor: not-allowed; }

    /* ── Progress bar ────────────────────────────── */

    .progress-wrap {
      display: none;
      padding: 12px 20px;
      border-top: 1px solid #1e1e1e;
      flex-direction: column;
      gap: 6px;
    }

    .progress-wrap.visible { display: flex; }

    .progress-track {
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #60a5fa;
      border-radius: 2px;
      transition: width 0.2s;
      width: 0%;
    }

    .progress-label {
      font-size: 11px;
      color: #666;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .progress-errors {
      font-size: 11px;
      color: #f87171;
      margin-top: 2px;
    }

    /* ── Sub-tables ──────────────────────────────── */

    .sub-sections { display: flex; flex-direction: column; gap: 0; }

    .sub-section { border-top: 1px solid #1e1e1e; }

    .sub-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      user-select: none;
    }

    .sub-header .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 700; }

    .badge-nas    { background: #1e2d1e; color: #6fcf6f; }
    .badge-runpod { background: #1e2537; color: #60a5fa; }
    .badge-diff   { background: #2d2010; color: #fb923c; }

    .file-table {
      width: 100%;
      font-size: 11px;
      border-collapse: collapse;
    }

    .file-table th {
      text-align: left;
      padding: 6px 20px;
      font-size: 10px;
      font-weight: 500;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #151515;
    }

    .file-table th.th-check {
      width: 32px;
      padding: 6px 8px 6px 20px;
    }

    .file-table td {
      padding: 5px 20px;
      color: #888;
      border-top: 1px solid #1a1a1a;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .file-table td.td-check {
      padding: 5px 8px 5px 20px;
      width: 32px;
    }

    .file-table tr:hover td { background: #1d1d1d; }
    .file-table tr.transferred td { opacity: 0.35; }
    .file-table tr.transfer-error td { background: #1a1010; }

    .file-table td.path { color: #bbb; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-table td.size { color: #666; text-align: right; white-space: nowrap; }
    .file-table td.status-cell { width: 80px; text-align: right; white-space: nowrap; color: #444; font-size: 10px; }

    .more-row td { color: #444; font-style: italic; padding: 6px 20px; }

    /* ── Checkboxes ──────────────────────────────── */

    input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: #60a5fa;
      cursor: pointer;
    }

    /* ── DB section ──────────────────────────────── */

    .db-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .db-table-wrap {
      border-right: 1px solid #1e1e1e;
      padding: 14px 20px;
    }

    .db-table-wrap:nth-child(even) { border-right: none; }
    .db-table-wrap:nth-child(n+3)  { border-top: 1px solid #1e1e1e; }

    .db-table-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 10px;
    }

    .db-diff-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 3px 0;
    }

    .db-diff-row .db-name { color: #bbb; font-family: 'SF Mono', 'Fira Code', monospace; }
    .db-diff-row .db-side { font-size: 10px; padding: 1px 6px; border-radius: 4px; }
    .db-diff-row .on-nas    { background: #1e2d1e; color: #6fcf6f; }
    .db-diff-row .on-runpod { background: #1e2537; color: #60a5fa; }

    .db-synced { font-size: 11px; color: #3a3a3a; font-style: italic; }

    .empty { padding: 16px 20px; font-size: 12px; color: #3a3a3a; font-style: italic; }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="topbar">
    <button onclick="goBack()">← Back</button>
    <span class="topbar-title">Sync Tool</span>
  </div>

  <!-- Scrollable content -->
  <div class="content">

    <!-- Login card -->
    <div class="login-card" id="login-card">
      <h2>Compare Backends</h2>
      <p>Scans both your Local and RunPod backends and shows what's different — output files, models, and database records.</p>

      <div class="urls-row">
        <div class="url-badge">
          <div class="url-label">Local (NAS)</div>
          <div class="url-value" id="url-local-display">—</div>
        </div>
        <div class="url-badge">
          <div class="url-label">RunPod</div>
          <div class="url-value" id="url-runpod-display">—</div>
        </div>
      </div>

      <label for="password">Admin Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

      <div class="error" id="error"></div>

      <button class="primary" id="compare-btn" onclick="runCompare()">
        Compare
        <span class="spinner" id="spinner"></span>
      </button>
    </div>

    <!-- Results (hidden until compare runs) -->
    <div class="results" id="results">

      <!-- Output Files -->
      <div class="section" id="sec-files">
        <div class="section-header" onclick="toggleSection('sec-files')">
          <span class="section-title">Output Files</span>
          <span class="section-summary" id="sum-files"></span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body" id="body-files"></div>
      </div>

      <!-- Models -->
      <div class="section" id="sec-models">
        <div class="section-header" onclick="toggleSection('sec-models')">
          <span class="section-title">Models</span>
          <span class="section-summary" id="sum-models"></span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body" id="body-models"></div>
      </div>

      <!-- Databases -->
      <div class="section" id="sec-db">
        <div class="section-header" onclick="toggleSection('sec-db')">
          <span class="section-title">Databases</span>
          <span class="section-summary" id="sum-db"></span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body" id="body-db"></div>
      </div>

    </div>
  </div>

  <script>
    const MAX_ROWS = 200

    // password is kept in memory after Compare so Transfer can reuse it
    let sessionPassword = ''

    // ── Navigation ────────────────────────────────────────────────────────────

    function goBack() {
      window.electronAPI.getBackendUrl().then(url => {
        if (url) window.location.reload()
      })
    }

    // ── Pre-fill stored URLs ──────────────────────────────────────────────────

    window.electronAPI.getBackendConfig().then(cfg => {
      document.getElementById('url-local-display').textContent  = cfg.localUrl  || '(not set)'
      document.getElementById('url-runpod-display').textContent = cfg.runpodUrl || '(not set)'
    })

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') runCompare()
    })

    // ── Compare ───────────────────────────────────────────────────────────────

    async function runCompare() {
      const password = document.getElementById('password').value
      const errEl    = document.getElementById('error')
      const btn      = document.getElementById('compare-btn')
      const spinner  = document.getElementById('spinner')

      errEl.textContent = ''
      if (!password) { errEl.textContent = 'Enter the admin password.'; return }

      btn.disabled          = true
      spinner.style.display = 'inline-block'
      document.getElementById('results').style.display = 'none'

      const result = await window.electronAPI.compareBackends({ password })

      btn.disabled          = false
      spinner.style.display = 'none'

      if (result.error) { errEl.textContent = result.error; return }

      sessionPassword = password

      renderFiles(result.files,  'body-files',  'sum-files',  'files')
      renderFiles(result.models, 'body-models', 'sum-models', 'models')
      renderDb(result.db)

      document.getElementById('results').style.display = 'flex'
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function fmtSize(bytes) {
      if (bytes < 1024)                return bytes + ' B'
      if (bytes < 1048576)             return (bytes / 1024).toFixed(1) + ' KB'
      if (bytes < 1073741824)          return (bytes / 1048576).toFixed(1) + ' MB'
      return (bytes / 1073741824).toFixed(2) + ' GB'
    }

    function toggleSection(id) {
      document.getElementById(id).classList.toggle('collapsed')
    }

    // ── File diff rendering ───────────────────────────────────────────────────

    function renderFiles(diff, bodyId, sumId, key) {
      const body = document.getElementById(bodyId)
      const sum  = document.getElementById(sumId)
      const total = diff.onlyLocal.length + diff.onlyRunpod.length + diff.different.length

      if (total === 0) {
        sum.textContent = `${diff.totalLocal} files — in sync`
        body.innerHTML  = '<div class="empty">Everything is in sync.</div>'
        return
      }

      sum.textContent = `${diff.onlyLocal.length} only on NAS · ${diff.onlyRunpod.length} only on RunPod · ${diff.different.length} different`

      const pills = `
        <div class="pill-row" id="pill-row-${key}">
          <span class="pill pill-nas">   <span class="pill-count">${diff.totalLocal}</span>  on NAS</span>
          <span class="pill pill-runpod"><span class="pill-count">${diff.totalRunpod}</span> on RunPod</span>
          ${diff.onlyLocal.length  ? `<span class="pill pill-nas">   <span class="pill-count">${diff.onlyLocal.length}</span>  only on NAS</span>` : ''}
          ${diff.onlyRunpod.length ? `<span class="pill pill-runpod"><span class="pill-count">${diff.onlyRunpod.length}</span> only on RunPod</span>` : ''}
          ${diff.different.length  ? `<span class="pill pill-diff">  <span class="pill-count">${diff.different.length}</span>  size mismatch</span>` : ''}
          ${diff.onlyRunpod.length ? `
          <div class="transfer-bar">
            <span class="transfer-count" id="tc-${key}">0 selected</span>
            <button class="transfer-btn" id="tbtn-${key}" onclick="startTransfer('${key}')" disabled>
              ↓ Transfer to NAS
            </button>
          </div>` : ''}
        </div>`

      // Progress bar (hidden initially)
      const progressHtml = `
        <div class="progress-wrap" id="prog-${key}">
          <div class="progress-track"><div class="progress-fill" id="prog-fill-${key}"></div></div>
          <div class="progress-label" id="prog-label-${key}"></div>
          <div class="progress-errors" id="prog-errors-${key}"></div>
        </div>`

      let html = pills + progressHtml + '<div class="sub-sections">'

      if (diff.onlyLocal.length) {
        html += plainSubTable('Only on NAS', 'badge-nas', diff.onlyLocal)
      }
      if (diff.onlyRunpod.length) {
        html += transferSubTable(`Only on RunPod`, 'badge-runpod', diff.onlyRunpod, key)
      }
      if (diff.different.length) {
        html += plainSubTable('Size mismatch', 'badge-diff', diff.different)
      }

      html += '</div>'
      body.innerHTML = html

      // Wire up Select-All checkbox
      if (diff.onlyRunpod.length) {
        updateTransferCount(key)
      }
    }

    function plainSubTable(label, badgeCls, rows) {
      const shown = rows.slice(0, MAX_ROWS)
      const more  = rows.length - shown.length

      let rowsHtml = shown.map(f => `
        <tr>
          <td class="path" title="${esc(f.path)}">${esc(f.path)}</td>
          <td class="size">${fmtSize(f.size)}</td>
        </tr>`).join('')

      if (more > 0) rowsHtml += `<tr class="more-row"><td colspan="2">… and ${more} more</td></tr>`

      return `
        <div class="sub-section">
          <div class="sub-header">
            ${label} <span class="badge ${badgeCls}">${rows.length}</span>
          </div>
          <table class="file-table">
            <thead><tr><th>Path</th><th>Size</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`
    }

    function transferSubTable(label, badgeCls, rows, key) {
      const shown = rows.slice(0, MAX_ROWS)
      const more  = rows.length - shown.length

      let rowsHtml = shown.map((f, i) => `
        <tr id="row-${key}-${i}" data-path="${esc(f.path)}">
          <td class="td-check"><input type="checkbox" id="chk-${key}-${i}" onchange="updateTransferCount('${key}')"></td>
          <td class="path" title="${esc(f.path)}">${esc(f.path)}</td>
          <td class="size">${fmtSize(f.size)}</td>
          <td class="status-cell" id="st-${key}-${i}"></td>
        </tr>`).join('')

      if (more > 0) rowsHtml += `<tr class="more-row"><td colspan="4">… and ${more} more (shown first ${MAX_ROWS})</td></tr>`

      return `
        <div class="sub-section">
          <div class="sub-header">
            ${label} <span class="badge ${badgeCls}">${rows.length}</span>
            <span style="margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10px; color:#555; font-weight:400; text-transform:none;">
              <input type="checkbox" id="sel-all-${key}" onchange="selectAll('${key}', this.checked)" style="margin:0">
              Select all
            </span>
          </div>
          <table class="file-table">
            <thead>
              <tr>
                <th class="th-check"></th>
                <th>Path</th>
                <th>Size</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody-${key}">${rowsHtml}</tbody>
          </table>
        </div>`
    }

    // ── Checkbox helpers ──────────────────────────────────────────────────────

    function selectAll(key, checked) {
      const tbody = document.getElementById(`tbody-${key}`)
      tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = checked })
      updateTransferCount(key)
    }

    function updateTransferCount(key) {
      const tbody = document.getElementById(`tbody-${key}`)
      if (!tbody) return
      const count = tbody.querySelectorAll('input[type="checkbox"]:checked').length
      const countEl = document.getElementById(`tc-${key}`)
      const btn     = document.getElementById(`tbtn-${key}`)
      if (countEl) countEl.textContent = count === 0 ? '0 selected' : `${count} selected`
      if (btn)     btn.disabled = count === 0
    }

    // ── Transfer ──────────────────────────────────────────────────────────────

    async function startTransfer(key) {
      const tbody = document.getElementById(`tbody-${key}`)
      const rows  = [...tbody.querySelectorAll('tr[data-path]')]
      const selected = rows
        .filter(tr => tr.querySelector('input[type="checkbox"]')?.checked)
        .map(tr => tr.getAttribute('data-path'))

      if (selected.length === 0) return

      const btn     = document.getElementById(`tbtn-${key}`)
      const progWrap = document.getElementById(`prog-${key}`)
      const progFill = document.getElementById(`prog-fill-${key}`)
      const progLabel = document.getElementById(`prog-label-${key}`)
      const progErrors = document.getElementById(`prog-errors-${key}`)
      const selAll   = document.getElementById(`sel-all-${key}`)

      btn.disabled   = true
      if (selAll) selAll.disabled = true
      tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.disabled = true })
      progWrap.classList.add('visible')
      progErrors.textContent = ''
      progLabel.textContent  = `0 / ${selected.length}`
      progFill.style.width   = '0%'

      const errorList = []

      window.electronAPI.offTransferProgress()
      window.electronAPI.onTransferProgress(({ done, total, path, error }) => {
        const pct = Math.round((done / total) * 100)
        progFill.style.width  = pct + '%'
        progLabel.textContent = `${done} / ${total}  —  ${path.split('/').pop()}`

        // Find the row and mark it
        const matchRow = rows.find(tr => tr.getAttribute('data-path') === path)
        if (matchRow) {
          const rowIdx = rows.indexOf(matchRow)
          const stEl   = document.getElementById(`st-${key}-${rowIdx}`)
          if (error) {
            matchRow.classList.add('transfer-error')
            if (stEl) stEl.textContent = '✗ error'
            errorList.push(`${path}: ${error}`)
          } else {
            matchRow.classList.add('transferred')
            if (stEl) stEl.textContent = '✓ done'
          }
        }

        if (done === total) {
          progLabel.textContent = `Done — ${done - errorList.length} transferred, ${errorList.length} failed`
          if (errorList.length > 0) {
            progErrors.innerHTML = errorList.map(e => esc(e)).join('<br>')
          }
        }
      })

      await window.electronAPI.transferFiles({ paths: selected, password: sessionPassword })

      // Re-enable select-all and non-transferred checkboxes
      tbody.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => {
        const tr = rows[i]
        if (tr && !tr.classList.contains('transferred')) cb.disabled = false
      })
      if (selAll) selAll.disabled = false
      updateTransferCount(key)
    }

    // ── DB diff rendering ─────────────────────────────────────────────────────

    function renderDb(db) {
      const body = document.getElementById('body-db')
      const sum  = document.getElementById('sum-db')

      const tables = [
        { key: 'users',    label: 'Users',    nameKey: 'username' },
        { key: 'groups',   label: 'Groups',   nameKey: 'name'     },
        { key: 'clients',  label: 'Clients',  nameKey: 'name'     },
        { key: 'projects', label: 'Projects', nameKey: 'name'     },
        { key: 'tools',    label: 'Tools',    nameKey: 'name'     },
      ]

      let totalDiffs = 0
      let gridHtml   = '<div class="db-grid">'

      for (const t of tables) {
        const diff = db[t.key]
        if (!diff) continue

        totalDiffs += diff.onlyLocal.length + diff.onlyRunpod.length

        let rowsHtml = ''
        for (const r of diff.onlyLocal) {
          rowsHtml += `<div class="db-diff-row">
            <span class="db-name">${esc(String(r[t.nameKey] ?? r.id ?? '?'))}</span>
            <span class="db-side on-nas">NAS only</span>
          </div>`
        }
        for (const r of diff.onlyRunpod) {
          rowsHtml += `<div class="db-diff-row">
            <span class="db-name">${esc(String(r[t.nameKey] ?? r.id ?? '?'))}</span>
            <span class="db-side on-runpod">RunPod only</span>
          </div>`
        }
        if (!rowsHtml) rowsHtml = `<div class="db-synced">In sync (${diff.totalLocal})</div>`

        gridHtml += `<div class="db-table-wrap">
          <div class="db-table-title">${t.label}</div>
          ${rowsHtml}
        </div>`
      }

      gridHtml += '</div>'
      body.innerHTML  = gridHtml
      sum.textContent = totalDiffs === 0 ? 'In sync' : `${totalDiffs} difference${totalDiffs !== 1 ? 's' : ''}`
    }

    // ── XSS guard ─────────────────────────────────────────────────────────────

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }
  </script>
</body>
