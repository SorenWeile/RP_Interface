appId: com.studio.ai-toolhouse
productName: AI Toolhouse
copyright: Studio

icon: electron/assets/icon.png

directories:
  output: release
  buildResources: electron/assets

files:
  - dist-electron/**
  - "!dist-electron/**/*.map"
  - dist-frontend/**

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity

publish:
  provider: github
  releaseType: release
